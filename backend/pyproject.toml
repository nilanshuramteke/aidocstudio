[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-doc-studio"
version = "0.0.1"
description = "Local-first document intelligence studio"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pymupdf>=1.24",
  "pillow>=10",
  "python-docx>=1.1",
  "python-multipart>=0.0.9",
  "python-pptx>=1.0",
  "openpyxl>=3.1",
  "extract-msg>=0.50",
  "olefile>=0.47",
  "defusedxml>=0.7",
  "watchdog>=4",
  "rapidocr-onnxruntime>=1.3",
  "onnxruntime>=1.18",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "sqlite-vec>=0.1.6",
  "argon2-cffi>=23",
  "cryptography>=42",
  "keyring>=25",
  "sqlcipher3-wheels>=0.5",
]

[project.optional-dependencies]
tesseract = ["pytesseract>=0.3"]
tray = ["pystray>=0.19"]
dev = ["pytest>=8", "pytest-timeout>=2.3", "httpx>=0.27", "import-linter>=2.0", "ruff>=0.4"]

[project.scripts]
adstudio = "adstudio.main:run"

[tool.hatch.build.targets.wheel]
packages = ["adstudio"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "adstudio"

[[tool.importlinter.contracts]]
name = "Domain never imports the API layer"
type = "forbidden"
source_modules = ["adstudio.core", "adstudio.storage", "adstudio.jobs", "adstudio.documents", "adstudio.ingestion"]
forbidden_modules = ["adstudio.api"]
